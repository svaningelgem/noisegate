[package]
name = "roommute-dsp"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
description = "Trait-based real-time noise-suppression DSP layer. RNNoise (default) or any ONNX-exported denoise model (e.g. DeepFilterNet3 from Hugging Face)."
keywords = ["noise-suppression", "rnnoise", "speech-enhancement", "real-time", "dsp"]
categories = ["multimedia::audio", "science"]

[dependencies]
anyhow.workspace = true
thiserror.workspace = true
tracing.workspace = true

# Default backend.
nnnoiseless = { version = "0.5" }

# STFT for the DeepFilterNet front-end. realfft is what libDF itself uses, and
# rustfft underneath it is already in the tree via nnnoiseless.
realfft = "3"

# Optional ONNX backend. Pinned exactly: a plain "2.0.0-rc.N" requirement lets
# cargo pick any later 2.x pre-release, and the ort release candidates break
# API between themselves — including ort's own dependency on ort-sys, which is
# how "rc.4" ended up resolving to an ort-sys that ort itself can't compile
# against. Bump this deliberately, not by accident.
ort = { version = "=2.0.0-rc.10", default-features = false, features = ["load-dynamic"] }

# Upstream DeepFilterNet's own runner. Its `tract` feature brings tract-pulse,
# which pulsifies the exported graphs and threads their GRU and convolution
# state across frames. That state is the whole problem with real-time use:
# these graphs expose no hidden state, so running them a frame at a time under
# ONNX Runtime resets the model's memory every hop and costs ~6 dB of the near
# voice. Measured, not assumed — see docs/model-pipeline.md.
#
# Using upstream's runner rather than reimplementing it also means the model we
# ship can be one we exported ourselves from the published checkpoint, with no
# third-party repackaging anywhere in the chain. MIT/Apache-2.0.
deep_filter = { git = "https://github.com/Rikorose/DeepFilterNet", rev = "d375b2d", default-features = false, features = ["tract"] }
ndarray = { version = "0.15" }

# libDF only accepts its model as a .tar.gz, so we build one in memory from the
# loose files the installer lays down. Both already come in with deep_filter,
# which reads the same format — this only asks for them by name.
tar = { version = "0.4" }
flate2 = { version = "1" }

# Pinned, and not because we call tract ourselves — we don't. libDF asks for
# `tract-core = "^0.21.4"` and still uses ndarray 0.15, but tract moved to
# ndarray 0.16 somewhere in the 0.21.x line. Take cargo's newest match and
# upstream's own tract.rs stops compiling, because its `Axis` and tract's
# become two unrelated types. These pins hold tract on the ndarray-0.15 side of
# that split.
tract-core = { version = "=0.21.5" }
tract-onnx = { version = "=0.21.5" }
tract-pulse = { version = "=0.21.5" }
tract-hir = { version = "=0.21.5" }
